<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HyperTracker - Science Based</title>
    
    <!-- Enlace al Manifest real -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151f32', 900: '#0f172a', 950: '#020617' },
                        accent: { 500: '#3b82f6', 600: '#2563eb' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }
        ::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input, select { background-color: #1e293b !important; color: white !important; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden text-slate-200">

    <header class="bg-slate-950 px-4 py-4 shrink-0 shadow-md z-20">
        <div class="flex justify-between items-center mb-3">
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-300">
                <i class="ph ph-barbell text-blue-400 align-middle"></i> HyperTracker
            </h1>
            <div id="pwa-install-container" class="hidden">
                <button id="btn-install" class="bg-blue-600/20 text-blue-400 px-3 py-1.5 rounded-lg text-sm font-semibold border border-blue-500/30">
                    Instalar App
                </button>
            </div>
        </div>

        <div class="bg-slate-850 rounded-2xl p-3 flex flex-col gap-2">
            <div class="flex justify-between items-center">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Descanso (SNC)</span>
                <span id="timer-display" class="text-2xl font-black text-white font-mono tracking-widest">00:00</span>
            </div>
            <div class="grid grid-cols-4 gap-2">
                <button onclick="startTimer(90)" class="bg-slate-700 hover:bg-slate-600 py-2 rounded-xl text-sm font-semibold">90s</button>
                <button onclick="startTimer(120)" class="bg-slate-700 hover:bg-slate-600 py-2 rounded-xl text-sm font-semibold">2m</button>
                <button onclick="startTimer(180)" class="bg-slate-700 hover:bg-slate-600 py-2 rounded-xl text-sm font-semibold">3m</button>
                <button onclick="stopTimer()" class="bg-red-900/30 text-red-400 hover:bg-red-900/50 py-2 rounded-xl flex items-center justify-center">
                    <i class="ph ph-stop text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <nav class="flex shrink-0 bg-slate-900 border-b border-slate-800">
        <button onclick="switchTab('workout')" id="tab-workout" class="flex-1 py-3 text-sm font-semibold tab-active text-slate-400">
            <i class="ph ph-notebook text-lg block mb-1"></i> Rutina
        </button>
        <button onclick="switchTab('analytics')" id="tab-analytics" class="flex-1 py-3 text-sm font-semibold text-slate-400">
            <i class="ph ph-chart-line-up text-lg block mb-1"></i> Analíticas
        </button>
    </nav>

    <main class="flex-1 overflow-y-auto hide-scroll pb-20 fade-in bg-slate-900">
        <div id="view-workout" class="p-4 space-y-6">
            <div class="flex gap-2 overflow-x-auto hide-scroll pb-2 -mx-4 px-4 snap-x">
                <div id="days-container" class="flex gap-2"></div>
            </div>
            <div id="routine-header" class="mb-4">
                <h2 id="routine-day-title" class="text-2xl font-bold text-white">Día 1: Push</h2>
                <p id="routine-day-desc" class="text-sm text-slate-400">Pectoral, Hombros y Tríceps</p>
            </div>
            <div id="exercises-list" class="space-y-4"></div>
        </div>

        <div id="view-analytics" class="hidden p-4 space-y-6">
            <h2 class="text-xl font-bold text-white mb-2">Progreso de Hipertrofia</h2>
            <div class="relative mb-6">
                <select id="chart-exercise-select" onchange="updateChart()" class="w-full bg-slate-800 text-white rounded-xl p-4 font-semibold appearance-none border border-slate-700 outline-none"></select>
                <i class="ph ph-caret-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
            </div>
            <div class="bg-slate-850 p-4 rounded-2xl shadow-lg border border-slate-800/50">
                <canvas id="progressChart" height="250"></canvas>
            </div>
            
            <div class="mt-8 p-4 bg-slate-800/50 rounded-2xl border border-slate-700/50 border-dashed">
                <h3 class="text-sm font-bold text-white mb-3"><i class="ph ph-database text-blue-400"></i> Backup de Datos</h3>
                <div class="flex gap-2">
                    <button onclick="exportData()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white text-sm font-semibold py-2.5 rounded-xl flex justify-center items-center gap-2">
                        <i class="ph ph-export"></i> Exportar
                    </button>
                    <button onclick="document.getElementById('import-file').click()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white text-sm font-semibold py-2.5 rounded-xl flex justify-center items-center gap-2">
                        <i class="ph ph-import"></i> Importar
                    </button>
                    <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">
                </div>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-blue-600 text-white px-6 py-3 rounded-full font-semibold shadow-xl transform transition-all duration-300 translate-y-20 opacity-0 z-50 flex items-center gap-2">
        <i class="ph ph-check-circle text-xl"></i><span id="toast-msg">Guardado</span>
    </div>

    <!-- Modal Readiness -->
    <div id="readiness-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex-col justify-end sm:justify-center items-center p-4">
        <div class="bg-slate-900 w-full max-w-md rounded-3xl p-6 border border-slate-800 shadow-2xl transform transition-transform translate-y-full" id="readiness-content">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-white">Readiness Score</h3>
                <button onclick="closeReadinessModal()" class="text-slate-400"><i class="ph ph-x text-2xl"></i></button>
            </div>
            <div class="space-y-6">
                <div>
                    <label class="flex justify-between text-sm font-semibold text-white mb-2"><span>Horas de sueño</span><span id="val-sleep" class="text-accent-400">7 hrs</span></label>
                    <input type="range" id="input-sleep" min="4" max="10" step="0.5" value="7" oninput="document.getElementById('val-sleep').innerText = this.value + ' hrs'" class="w-full accent-blue-500">
                </div>
                <div>
                    <label class="flex justify-between text-sm font-semibold text-white mb-2"><span>Estrés</span><span id="val-stress" class="text-accent-400">Moderado (3)</span></label>
                    <input type="range" id="input-stress" min="1" max="5" value="3" oninput="updateRangeLabel('val-stress', this.value, ['Muy Bajo', 'Bajo', 'Moderado', 'Alto', 'Extremo'])" class="w-full accent-blue-500">
                </div>
                <div>
                    <label class="flex justify-between text-sm font-semibold text-white mb-2"><span>Agujetas</span><span id="val-doms" class="text-accent-400">Moderado (3)</span></label>
                    <input type="range" id="input-doms" min="1" max="5" value="3" oninput="updateRangeLabel('val-doms', this.value, ['Nada', 'Leve', 'Moderado', 'Fuerte', 'Incapacitante'])" class="w-full accent-blue-500">
                </div>
            </div>
            <button onclick="saveReadiness()" class="w-full mt-8 bg-accent-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-500/20 active:scale-95 transition">Calcular Score</button>
        </div>
    </div>

    <script>
        const routineData = [
            { dayIndex: 1, name: 'Día 1: Push', short: 'L', focus: 'Pectoral, Hombro, Tríceps, Abs', exercises: ['Press de Banca', 'Press Inclinado', 'Elevaciones Laterales', 'Extensión Tríceps en polea', 'Pec-Deck', 'Crunches Abdominales', 'Elevaciones de piernas colgado'] },
            { dayIndex: 2, name: 'Día 2: Pull', short: 'M', focus: 'Espalda, Bíceps, Delts Post', exercises: ['Dominadas / Jalón al pecho', 'Remo con Barra', 'Remo en T', 'Face Pulls', 'Curl de Bíceps inclinado', 'Curl Martillo'] },
            { dayIndex: 3, name: 'Día 3: Legs 1', short: 'X', focus: 'Enfoque Cuádriceps, Abs', exercises: ['Sentadilla con barra', 'Peso Muerto Rumano (RDL)', 'Extensiones de Cuádriceps', 'Máquina Abductores', 'Máquina Aductores', 'Elevaciones de gemelos de pie', 'Crunches Abdominales', 'Elevaciones de piernas colgado'] },
            { dayIndex: 4, name: 'Día 4: Descanso', short: 'J', focus: 'Recuperación Activa', exercises: [] },
            { dayIndex: 5, name: 'Día 5: Upper', short: 'V', focus: 'Torso Completo', exercises: ['Press Militar', 'Remo en polea baja apoyado', 'Press de Pecho en máquina', 'Dominadas supinas', 'Superset Bíceps/Tríceps'] },
            { dayIndex: 6, name: 'Día 6: Lower 2', short: 'S', focus: 'Isquios, Glúteos, Abs', exercises: ['Prensa de Piernas / Búlgara', 'Curl de Isquios sentado', 'Hip Thrust', 'Elevación gemelos sentado', 'Crunches Abdominales', 'Elevaciones de piernas colgado'] },
            { dayIndex: 0, name: 'Día 7: Descanso', short: 'D', focus: 'Recuperación', exercises: [] },
        ];

        let activeDayIndex = new Date().getDay();
        let trainingLogs = JSON.parse(localStorage.getItem('hyperTrackerLogs')) || [];
        let readinessLogs = JSON.parse(localStorage.getItem('hyperTrackerReadiness')) || {};
        let activeExerciseInputs = {};

        document.addEventListener('DOMContentLoaded', () => {
            renderDaySelector();
            selectDay(activeDayIndex);
        });

        function renderDaySelector() {
            const container = document.getElementById('days-container');
            container.innerHTML = '';
            const orderedDays = [1, 2, 3, 4, 5, 6, 0];
            orderedDays.forEach(dIndex => {
                const day = routineData.find(r => r.dayIndex === dIndex);
                const isToday = new Date().getDay() === dIndex;
                const btn = document.createElement('button');
                btn.className = `min-w-[60px] p-3 rounded-2xl flex flex-col items-center justify-center snap-center transition-colors ${dIndex === activeDayIndex ? 'bg-accent-600 text-white' : 'bg-slate-800 text-slate-400'}`;
                btn.onclick = () => selectDay(dIndex);
                btn.id = `day-btn-${dIndex}`;
                btn.innerHTML = `<span class="text-xs font-medium mb-1">${day.short}</span>${isToday ? '<div class="w-1.5 h-1.5 rounded-full bg-white mb-1"></div>' : ''}`;
                container.appendChild(btn);
            });
        }

        function selectDay(index) {
            document.querySelectorAll('#days-container button').forEach(b => {
                b.classList.remove('bg-accent-600', 'text-white');
                b.classList.add('bg-slate-800', 'text-slate-400');
            });
            const activeBtn = document.getElementById(`day-btn-${index}`);
            if(activeBtn) {
                activeBtn.classList.remove('bg-slate-800', 'text-slate-400');
                activeBtn.classList.add('bg-accent-600', 'text-white');
            }
            activeDayIndex = index;
            const dayInfo = routineData.find(r => r.dayIndex === index);
            document.getElementById('routine-day-title').innerText = dayInfo.name;
            document.getElementById('routine-day-desc').innerText = dayInfo.focus;
            renderExercises(dayInfo.exercises);

            if (index === new Date().getDay() && dayInfo.exercises.length > 0) checkReadiness();
        }

        function renderExercises(exercises) {
            const container = document.getElementById('exercises-list');
            container.innerHTML = '';
            if(exercises.length === 0) {
                container.innerHTML = `<div class="text-center p-8 bg-slate-800/50 rounded-2xl border border-slate-800 border-dashed"><p class="text-slate-400">Día de descanso.</p></div>`;
                return;
            }

            exercises.forEach((ex, idx) => {
                const todayStr = new Date().toISOString().split('T')[0];
                const logFromToday = trainingLogs.find(log => log.exercise === ex && log.date === todayStr);
                const lastLog = [...trainingLogs].reverse().find(log => log.exercise === ex);
                
                if(!activeExerciseInputs[ex]) {
                    if (logFromToday) {
                        activeExerciseInputs[ex] = logFromToday.sets.map(s => ({weight: s.weight, reps: s.reps, rir: s.rir}));
                    } else if (lastLog && lastLog.sets) {
                        activeExerciseInputs[ex] = lastLog.sets.map(s => ({weight: s.weight, reps: '', rir: s.rir}));
                    } else {
                        activeExerciseInputs[ex] = [{ weight: '', reps: '', rir: '2' }, { weight: '', reps: '', rir: '1' }, { weight: '', reps: '', rir: '0' }];
                    }
                }

                const card = document.createElement('div');
                card.className = "bg-slate-800 rounded-3xl overflow-hidden border border-slate-700/50 shadow-sm";
                
                let setsHTML = '';
                activeExerciseInputs[ex].forEach((set, sIdx) => {
                    if (ex === 'Elevaciones de piernas colgado') {
                        setsHTML += `
                            <div class="flex items-center gap-2 mb-3 bg-slate-900/50 p-2 rounded-xl">
                                <span class="w-6 text-center text-xs font-bold text-slate-500">${sIdx + 1}</span>
                                <div class="flex-1 relative">
                                    <input type="number" placeholder="Repeticiones" value="${set.reps}" oninput="updateSetData('${ex}', ${sIdx}, 'reps', this.value)" class="w-full bg-transparent text-sm p-3 rounded-lg border border-slate-700 text-center">
                                    <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-500">reps</span>
                                </div>
                            </div>
                        `;
                    } else {
                        setsHTML += `
                            <div class="flex items-center gap-2 mb-3 bg-slate-900/50 p-2 rounded-xl">
                                <span class="w-6 text-center text-xs font-bold text-slate-500">${sIdx + 1}</span>
                                <div class="flex-1 relative">
                                    <input type="number" step="0.5" placeholder="Peso" value="${set.weight}" oninput="updateSetData('${ex}', ${sIdx}, 'weight', this.value)" class="w-full bg-transparent text-sm p-3 rounded-lg border border-slate-700">
                                </div>
                                <div class="flex-1 relative">
                                    <input type="number" placeholder="Reps" value="${set.reps}" oninput="updateSetData('${ex}', ${sIdx}, 'reps', this.value)" class="w-full bg-transparent text-sm p-3 rounded-lg border border-slate-700">
                                </div>
                                <div class="flex-1 relative">
                                    <select onchange="updateSetData('${ex}', ${sIdx}, 'rir', this.value)" class="w-full bg-transparent text-sm p-3 rounded-lg border border-slate-700 appearance-none">
                                        <option value="3" ${set.rir == '3' ? 'selected' : ''}>RIR 3</option>
                                        <option value="2" ${set.rir == '2' ? 'selected' : ''}>RIR 2</option>
                                        <option value="1" ${set.rir == '1' ? 'selected' : ''}>RIR 1</option>
                                        <option value="0" ${set.rir == '0' ? 'selected' : ''}>RIR 0</option>
                                    </select>
                                </div>
                            </div>
                        `;
                    }
                });

                let headerRow = ex === 'Elevaciones de piernas colgado' 
                    ? `<div class="flex text-xs font-semibold text-slate-400 mb-2 px-8 uppercase text-center"><div class="flex-1">Repeticiones</div></div>` 
                    : `<div class="flex text-xs font-semibold text-slate-400 mb-2 px-8 uppercase"><div class="flex-1">Carga</div><div class="flex-1">Reps</div><div class="flex-1">Intensidad</div></div>`;

                card.innerHTML = `
                    <div class="p-4 bg-slate-700/20 flex justify-between items-center">
                        <h3 class="font-bold text-white text-lg">${ex}</h3>
                        ${lastLog && lastLog.date !== todayStr ? `<span class="text-xs text-blue-400 bg-blue-900/30 px-2 py-1 rounded-md">Último: ${lastLog.sets[0].weight ? lastLog.sets[0].weight + 'kg' : lastLog.sets[0].reps + ' reps'}</span>` : ''}
                    </div>
                    <div class="p-4 pt-2">
                        ${headerRow}
                        ${setsHTML}
                        <div class="flex gap-2 mt-4">
                            <button onclick="addSet('${ex}')" class="flex-1 py-3 rounded-xl border border-dashed border-slate-600 text-slate-400 text-sm hover:bg-slate-700"><i class="ph ph-plus"></i> Serie</button>
                            <button onclick="saveExerciseData('${ex}')" class="flex-1 py-3 rounded-xl bg-accent-600 text-white text-sm font-bold shadow-lg"><i class="ph ph-floppy-disk"></i> Guardar</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateSetData(exercise, setIndex, field, value) { activeExerciseInputs[exercise][setIndex][field] = value; }

        function addSet(exercise) {
            const sets = activeExerciseInputs[exercise];
            const lastSet = sets[sets.length - 1] || { weight: '', reps: '', rir: '1' };
            sets.push({ weight: lastSet.weight, reps: lastSet.reps, rir: lastSet.rir });
            renderExercises(routineData.find(r => r.dayIndex === activeDayIndex).exercises);
        }

        function saveExerciseData(exercise) {
            const setsData = activeExerciseInputs[exercise];
            const validSets = setsData.filter(s => exercise === 'Elevaciones de piernas colgado' ? s.reps !== '' : s.weight !== '' && s.reps !== '');
            if(validSets.length === 0) return showToast('Faltan datos', true);

            const todayStr = new Date().toISOString().split('T')[0];
            trainingLogs = trainingLogs.filter(log => !(log.date === todayStr && log.exercise === exercise));
            trainingLogs.push({ date: todayStr, exercise: exercise, sets: validSets });
            localStorage.setItem('hyperTrackerLogs', JSON.stringify(trainingLogs));
            showToast('Guardado');
            if(!document.getElementById('view-analytics').classList.contains('hidden')) updateChart();
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            toast.className = `fixed bottom-4 left-1/2 -translate-x-1/2 ${isError ? 'bg-red-600' : 'bg-blue-600'} text-white px-6 py-3 rounded-full font-semibold shadow-xl transform transition-all duration-300 z-50 flex items-center gap-2`;
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        let myChart = null;
        function switchTab(tabName) {
            if (tabName === 'workout') {
                document.getElementById('tab-workout').classList.add('tab-active');
                document.getElementById('tab-analytics').classList.remove('tab-active');
                document.getElementById('view-workout').classList.remove('hidden');
                document.getElementById('view-analytics').classList.add('hidden');
            } else {
                document.getElementById('tab-analytics').classList.add('tab-active');
                document.getElementById('tab-workout').classList.remove('tab-active');
                document.getElementById('view-analytics').classList.remove('hidden');
                document.getElementById('view-workout').classList.add('hidden');
                
                const select = document.getElementById('chart-exercise-select');
                select.innerHTML = '';
                const uniqueExercises = [...new Set(trainingLogs.map(log => log.exercise))];
                if (uniqueExercises.length === 0) return select.innerHTML = '<option>Sin datos</option>';
                uniqueExercises.forEach(ex => select.appendChild(new Option(ex, ex)));
                updateChart();
            }
        }

        function updateChart() {
            const exercise = document.getElementById('chart-exercise-select').value;
            if(!exercise || exercise === 'Sin datos') return;
            const exLogs = trainingLogs.filter(log => log.exercise === exercise).sort((a, b) => new Date(a.date) - new Date(b.date));
            const labels = [], volumeData = [], maxWeightData = [];
            exLogs.forEach(log => {
                labels.push(new Date(log.date).getDate() + '/' + (new Date(log.date).getMonth()+1));
                let dailyVol = 0, dailyMaxW = 0;
                log.sets.forEach(set => {
                    let w = parseFloat(set.weight) || (exercise === 'Elevaciones de piernas colgado' ? 1 : 0);
                    let r = parseInt(set.reps) || 0;
                    dailyVol += (w * r);
                    if (w > dailyMaxW) dailyMaxW = w;
                });
                volumeData.push(dailyVol);
                maxWeightData.push(dailyMaxW);
            });

            if (myChart) myChart.destroy();
            myChart = new Chart(document.getElementById('progressChart').getContext('2d'), {
                type: 'line',
                data: { labels: labels, datasets: [{ label: 'Volumen', data: volumeData, borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', fill: true, yAxisID: 'y' }, { label: 'Carga Máx', data: maxWeightData, type: 'bar', backgroundColor: 'rgba(148, 163, 184, 0.5)', yAxisID: 'y1' }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { position: 'left' }, y1: { position: 'right' } } }
            });
        }

        let timerInterval, timeRemaining = 0;
        function updateTimerDisplay() {
            document.getElementById('timer-display').innerText = `${Math.floor(timeRemaining / 60).toString().padStart(2, '0')}:${(timeRemaining % 60).toString().padStart(2, '0')}`;
        }
        function startTimer(seconds) {
            clearInterval(timerInterval); timeRemaining = seconds; updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeRemaining--; updateTimerDisplay();
                if (timeRemaining <= 0) { clearInterval(timerInterval); if(navigator.vibrate) navigator.vibrate([200, 100, 200]); showToast('¡Tiempo de descanso!'); }
            }, 1000);
        }
        function stopTimer() { clearInterval(timerInterval); timeRemaining = 0; updateTimerDisplay(); }

        function checkReadiness() {
            const todayStr = new Date().toISOString().split('T')[0];
            if (!readinessLogs[todayStr]) {
                document.getElementById('readiness-modal').classList.remove('hidden');
                document.getElementById('readiness-modal').classList.add('flex');
                setTimeout(() => document.getElementById('readiness-content').classList.remove('translate-y-full'), 10);
            }
        }
        function closeReadinessModal() {
            document.getElementById('readiness-content').classList.add('translate-y-full');
            setTimeout(() => { document.getElementById('readiness-modal').classList.add('hidden'); document.getElementById('readiness-modal').classList.remove('flex'); }, 300);
        }
        function updateRangeLabel(id, val, textArr) { document.getElementById(id).innerText = `${textArr[val-1]} (${val})`; }
        function saveReadiness() {
            const score = Math.round(Math.min((parseFloat(document.getElementById('input-sleep').value) / 8) * 50, 50) + ((6 - parseInt(document.getElementById('input-stress').value)) / 5) * 25 + ((6 - parseInt(document.getElementById('input-doms').value)) / 5) * 25);
            readinessLogs[new Date().toISOString().split('T')[0]] = { score };
            localStorage.setItem('hyperTrackerReadiness', JSON.stringify(readinessLogs));
            closeReadinessModal();
            setTimeout(() => showToast(`Score: ${score}/100. ${score < 65 ? 'Baja 1 rep' : '¡A tope!'}`), 500);
        }

        function exportData() {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([JSON.stringify({ logs: trainingLogs, readiness: readinessLogs })], { type: "application/json" }));
            a.download = `HT_Backup.json`;
            a.click();
        }
        function importData(e) {
            const reader = new FileReader();
            reader.onload = ev => {
                const data = JSON.parse(ev.target.result);
                if (data.logs) localStorage.setItem('hyperTrackerLogs', JSON.stringify(trainingLogs = data.logs));
                if (data.readiness) localStorage.setItem('hyperTrackerReadiness', JSON.stringify(readinessLogs = data.readiness));
                showToast('Importado'); setTimeout(() => location.reload(), 1000);
            };
            reader.readAsText(e.target.files[0]);
        }

        // PWA REGISTRATION (Nativo)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW Registered'))
                    .catch(err => console.log('SW Error:', err));
            });
        }
        
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwa-install-container').classList.remove('hidden');
            document.getElementById('btn-install').addEventListener('click', () => {
                document.getElementById('pwa-install-container').classList.add('hidden');
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => deferredPrompt = null);
            });
        });
    </script>
</body>
</html>
